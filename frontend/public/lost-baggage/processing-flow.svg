<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 390" role="img" aria-labelledby="title desc">
  <title id="title">Lost baggage claim processing flow</title>
  <desc id="desc">Claim intake and evidence upload move through OCR, personal-data masking, Azure AI classification and extraction, deterministic assessment, and human review. Incomplete evidence stays deficient.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1l6 3.5L1 8" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .stage{fill:#fff;stroke:#d9e1e8;stroke-width:2}
      .number{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f766e}
      .heading{font:700 21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}
      .body{font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#556477}
      .note{font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#5b6472}
    </style>
  </defs>
  <rect width="1440" height="390" fill="#f8fafc"/>
  <rect x="502" y="28" width="686" height="40" rx="20" fill="#dff5f1"/>
  <text x="845" y="54" text-anchor="middle" class="number">AgentIQX processing flow</text>

  <g fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M234 195h28"/><path d="M472 195h28"/><path d="M710 195h28"/><path d="M948 195h28"/><path d="M1186 195h28"/>
  </g>

  <rect class="stage" x="32" y="104" width="202" height="182" rx="18"/>
  <text x="52" y="137" class="number">01</text>
  <text x="52" y="179" class="heading">Claim intake</text>
  <text x="52" y="213" class="body">Structured claim</text>
  <text x="52" y="239" class="body">and evidence files</text>

  <rect class="stage" x="270" y="104" width="202" height="182" rx="18"/>
  <text x="290" y="137" class="number">02</text>
  <text x="290" y="179" class="heading">FastAPI + S3</text>
  <text x="290" y="213" class="body">Presigned upload</text>
  <text x="290" y="239" class="body">and hash check</text>

  <rect class="stage" x="508" y="104" width="202" height="182" rx="18"/>
  <text x="528" y="137" class="number">03</text>
  <text x="528" y="179" class="heading">OCR + masking</text>
  <text x="528" y="213" class="body">PaddleOCR pages</text>
  <text x="528" y="239" class="body">Presidio redaction</text>

  <rect class="stage" x="746" y="104" width="202" height="182" rx="18"/>
  <text x="766" y="137" class="number">04</text>
  <text x="766" y="179" class="heading">Azure AI</text>
  <text x="766" y="213" class="body">Page classification</text>
  <text x="766" y="239" class="body">Cited fact extraction</text>

  <rect class="stage" x="984" y="104" width="202" height="182" rx="18"/>
  <text x="1004" y="137" class="number">05</text>
  <text x="1004" y="179" class="heading">Rules + quantum</text>
  <text x="1004" y="213" class="body">Eligibility gates</text>
  <text x="1004" y="239" class="body">Payable readiness</text>

  <rect class="stage" x="1222" y="104" width="202" height="182" rx="18"/>
  <text x="1242" y="137" class="number">06</text>
  <text x="1242" y="179" class="heading">Human review</text>
  <text x="1242" y="213" class="body">Accept or request info</text>
  <text x="1242" y="239" class="body">Draft PDF report</text>

  <rect x="32" y="320" width="1392" height="45" rx="12" fill="#eaf0f6"/>
  <text x="728" y="348" text-anchor="middle" class="note">Decision-critical gaps remain DEFICIENT and return to a reviewer for information or reassessment.</text>
</svg>
