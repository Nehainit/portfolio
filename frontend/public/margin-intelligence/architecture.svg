<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 610" role="img" aria-labelledby="title desc">
  <title id="title">Margin Intelligence AI architecture</title>
  <desc id="desc">Application requests enter Python APIs, then Langflow workflows coordinate document intelligence, machine-learning and anomaly signals, and generative explanations. Validated structured results are persisted to storage and audit records and presented for human review.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="m1 1 6 3.5L1 8" fill="none" stroke="#667789" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>.box{fill:#fff;stroke:#d9e2e9;stroke-width:2}.head{font:700 21px Arial,Helvetica,sans-serif;fill:#223145}.body{font:16px Arial,Helvetica,sans-serif;fill:#5a6a7b}.cap{font:700 17px Arial,Helvetica,sans-serif;letter-spacing:1px;fill:#307a73}.note{font:16px Arial,Helvetica,sans-serif;fill:#526579}</style>
  </defs>
  <rect width="1440" height="610" fill="#f7f9fb"/>
  <text x="48" y="51" class="cap">APPLICATION &amp; ORCHESTRATION</text>
  <g fill="none" stroke="#667789" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M361 134h80"/><path d="M777 134h80"/>
  </g>
  <rect class="box" x="48" y="82" width="313" height="105" rx="18"/>
  <text x="72" y="122" class="head">Insurance application</text>
  <text x="72" y="155" class="body">Case and document requests</text>
  <rect class="box" x="441" y="82" width="336" height="105" rx="18"/>
  <text x="465" y="122" class="head">Python APIs</text>
  <text x="465" y="155" class="body">Validate inputs and responses</text>
  <rect x="857" y="82" width="535" height="105" rx="18" fill="#e4f3ed" stroke="#b6d9c9" stroke-width="2"/>
  <text x="881" y="122" class="head">Langflow workflows</text>
  <text x="881" y="155" class="body">Coordinate AI tasks and custom Python components</text>

  <path d="M1125 187v43H720v22" fill="none" stroke="#667789" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="48" y="252" width="1344" height="185" rx="22" fill="#edf3f7" stroke="#dbe6ee"/>
  <text x="72" y="286" class="cap">INTELLIGENCE CAPABILITIES</text>
  <rect class="box" x="72" y="308" width="391" height="102" rx="16"/>
  <text x="94" y="349" class="head">Document intelligence</text>
  <text x="94" y="380" class="body">OCR, extraction, consistency signals</text>
  <rect class="box" x="524" y="308" width="391" height="102" rx="16"/>
  <text x="546" y="349" class="head">Machine learning</text>
  <text x="546" y="380" class="body">Risk, anomaly and tampering indicators</text>
  <rect class="box" x="976" y="308" width="391" height="102" rx="16"/>
  <text x="998" y="349" class="head">Generative AI</text>
  <text x="998" y="380" class="body">Human-readable supporting explanations</text>

  <path d="M720 437v14H250v11" fill="none" stroke="#667789" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g fill="none" stroke="#667789" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M453 517h42"/><path d="M903 517h42"/>
  </g>
  <rect class="box" x="48" y="462" width="405" height="110" rx="17"/>
  <text x="70" y="503" class="head">Validated results</text>
  <text x="70" y="536" class="body">Confidence, reasons and signals</text>
  <rect class="box" x="495" y="462" width="408" height="110" rx="17"/>
  <text x="517" y="503" class="head">Data and audit layer</text>
  <text x="517" y="536" class="body">Persistent, traceable outputs</text>
  <rect class="box" x="945" y="462" width="447" height="110" rx="17"/>
  <text x="967" y="503" class="head">Human review</text>
  <text x="967" y="536" class="body">Professional control over uncertain cases</text>
</svg>
