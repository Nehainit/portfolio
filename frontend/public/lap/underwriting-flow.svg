<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 670" role="img" aria-labelledby="title desc">
  <title id="title">Loan Against Property dual-path underwriting flow</title>
  <desc id="desc">Bank statement path: PDF or CSV, OCR and normalization, transaction classification, deterministic cash-flow checks, eligibility. Structured application path: loan JSON, policy knockouts, XGBoost risk prediction, SHAP and LLM explanation, deterministic pricing. Both feed structured audit-ready outputs for human review.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="m1 1 6 3.5L1 8" fill="none" stroke="#67798b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>.box{fill:#fff;stroke:#d8e3e9;stroke-width:2}.title{font:700 20px Arial,Helvetica,sans-serif;fill:#203247}.body{font:16px Arial,Helvetica,sans-serif;fill:#5a6b7c}.cap{font:700 17px Arial,Helvetica,sans-serif;letter-spacing:1px;fill:#256f7a}.note{font:16px Arial,Helvetica,sans-serif;fill:#506273}</style>
  </defs>
  <rect width="1440" height="670" fill="#f7f9fc"/>
  <rect x="30" y="36" width="1380" height="246" rx="22" fill="#e9f3f4" stroke="#d3e6e7"/>
  <text x="52" y="73" class="cap">BANK-STATEMENT CASH-FLOW PATH</text>
  <g fill="none" stroke="#67798b" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M284 181h20"/><path d="M552 181h20"/><path d="M820 181h20"/><path d="M1088 181h20"/>
  </g>
  <rect class="box" x="52" y="107" width="232" height="142" rx="16"/>
  <text x="71" y="146" class="title">PDF / CSV statement</text>
  <text x="71" y="182" class="body">Financial transactions</text>
  <text x="71" y="209" class="body">and balances</text>
  <rect class="box" x="304" y="107" width="248" height="142" rx="16"/>
  <text x="323" y="146" class="title">OCR + normalise</text>
  <text x="323" y="182" class="body">Common pandas table</text>
  <text x="323" y="209" class="body">for both file types</text>
  <rect class="box" x="572" y="107" width="248" height="142" rx="16"/>
  <text x="591" y="146" class="title">Classify transactions</text>
  <text x="591" y="182" class="body">LLM-assisted labels</text>
  <text x="591" y="209" class="body">+ hidden EMI patterns</text>
  <rect class="box" x="840" y="107" width="248" height="142" rx="16"/>
  <text x="859" y="146" class="title">Cash-flow rules</text>
  <text x="859" y="182" class="body">Income, FOIR, DTI,</text>
  <text x="859" y="209" class="body">balances, liabilities</text>
  <rect class="box" x="1108" y="107" width="280" height="142" rx="16"/>
  <text x="1127" y="146" class="title">Eligibility result</text>
  <text x="1127" y="182" class="body">Decision + explicit</text>
  <text x="1127" y="209" class="body">rejection reasons</text>

  <rect x="30" y="306" width="1380" height="246" rx="22" fill="#edf1f8" stroke="#dce4ef"/>
  <text x="52" y="343" class="cap">STRUCTURED APPLICATION RISK PATH</text>
  <g fill="none" stroke="#67798b" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M284 451h20"/><path d="M552 451h20"/><path d="M820 451h20"/><path d="M1088 451h20"/>
  </g>
  <rect class="box" x="52" y="377" width="232" height="142" rx="16"/>
  <text x="71" y="416" class="title">Loan application</text>
  <text x="71" y="452" class="body">Borrower, loan,</text>
  <text x="71" y="479" class="body">collateral JSON</text>
  <rect class="box" x="304" y="377" width="248" height="142" rx="16"/>
  <text x="323" y="416" class="title">Policy knockouts</text>
  <text x="323" y="452" class="body">Mandatory checks</text>
  <text x="323" y="479" class="body">before ML scoring</text>
  <rect class="box" x="572" y="377" width="248" height="142" rx="16"/>
  <text x="591" y="416" class="title">Features + XGBoost</text>
  <text x="591" y="452" class="body">Risk prediction and</text>
  <text x="591" y="479" class="body">default probability</text>
  <rect class="box" x="840" y="377" width="248" height="142" rx="16"/>
  <text x="859" y="416" class="title">SHAP + LLM</text>
  <text x="859" y="452" class="body">Risk drivers and</text>
  <text x="859" y="479" class="body">decision explanation</text>
  <rect class="box" x="1108" y="377" width="280" height="142" rx="16"/>
  <text x="1127" y="416" class="title">Credit pricing</text>
  <text x="1127" y="452" class="body">Deterministic rules</text>
  <text x="1127" y="479" class="body">for approved cases</text>

  <rect x="30" y="579" width="1380" height="58" rx="14" fill="#dfeae9"/>
  <text x="720" y="616" text-anchor="middle" class="note">Both paths return structured decisions, reasons, features and audit data for application display or human approval.</text>
</svg>
